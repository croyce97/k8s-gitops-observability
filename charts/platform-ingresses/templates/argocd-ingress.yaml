{{- if .Values.argocd.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.argocd.host | quote }}
    external-dns.alpha.kubernetes.io/target: {{ join "," .Values.dnsTargets | quote }}
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  tls:
    - hosts:
        - {{ .Values.argocd.host | quote }}
  rules:
    - host: {{ .Values.argocd.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.argocd.serviceName | quote }}
                port:
                  number: {{ .Values.argocd.servicePort }}
{{- end }}

